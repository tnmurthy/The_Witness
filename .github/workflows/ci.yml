name: CI

# Runs on every push and pull request against main. Milestone 1 acceptance
# criterion: CI blocks merges on failing lint, typecheck, test, or build —
# each is a separate job so a failure clearly names which gate broke,
# rather than one opaque "CI failed" status.
#
# The deploy job at the bottom gates production Vercel deploys behind all
# four quality gates — it only runs on push to main (not on PRs), and only
# after lint, typecheck, test, and build have all passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values so `next build` can statically analyze pages that import
  # src/lib/env.ts without needing real Supabase credentials in CI. No
  # real secret is required for Milestone 1 — later milestones that add
  # integration tests against a real Supabase project will inject actual
  # secrets via repository/environment secrets, not by editing this file.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    # Only deploy on direct pushes to main — never on pull requests.
    # All four quality gates must pass before a single byte reaches Vercel.
    needs: [lint, typecheck, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://thewitness.mytestbed.tech
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull Vercel project metadata (project ID, org ID, env vars) into
      # .vercel/ so the subsequent build and deploy steps can find them.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build the production bundle using Vercel's own build pipeline so
      # output config, edge functions, and ISR settings are all respected.
      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Deploy the pre-built output. --prebuilt skips a redundant remote
      # build; Vercel just uploads the .vercel/output artefact.
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
