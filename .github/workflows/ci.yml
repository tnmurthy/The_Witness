name: CI

# Runs on every push and pull request against main. Milestone 1 acceptance
# criterion: CI blocks merges on failing lint, typecheck, test, or build —
# each is a separate job so a failure clearly names which gate broke,
# rather than one opaque "CI failed" status.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values so `next build` can statically analyze pages that import
  # src/lib/env.ts without needing real Supabase credentials in CI. No
  # real secret is required for Milestone 1 — later milestones that add
  # integration tests against a real Supabase project will inject actual
  # secrets via repository/environment secrets, not by editing this file.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
